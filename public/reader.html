<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS Reader</title>
<style>
  /* The reader: one quiet column of text. No panels, frames or glow; one accent colour, taken from the character. */
  :root {
    --bg: #03070d; --text: #d6f4ff; --soft: #a9c9d6; --muted: #6f97a8; --accent: #5fe1ff; --rule: rgba(95, 225, 255, 0.16);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  body.hal { --bg: #090303; --text: #ffe9e5; --soft: #dcbdb8; --muted: #a8837d; --accent: #ff4a3d; --rule: rgba(255, 74, 61, 0.2); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--soft); font-family: var(--sans); font-size: 15px; line-height: 1.65;
    -webkit-font-smoothing: antialiased; display: grid; grid-template-rows: auto 1fr; }

  /* the top line: what this is on the left, the few controls on the right */
  .bar { display: flex; align-items: center; gap: 14px; padding: 10px 24px; font-family: var(--mono); font-size: 10.5px;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--rule); }
  .bar .grow { flex: 1; }
  #kind { color: var(--accent); }
  #live { display: inline-flex; align-items: center; gap: 7px; }
  #live i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: beat 1.1s ease-in-out infinite; }
  @keyframes beat { 50% { opacity: 0.25; } }
  .bar button, .bar select { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--muted); background: none;
    border: 0; padding: 4px 0; cursor: pointer; outline: none; }
  .bar select { appearance: none; -webkit-appearance: none; max-width: 210px; }
  .bar button:hover, .bar select:hover, .bar button:focus-visible, .bar select:focus-visible { color: var(--accent); }
  .bar button:disabled { opacity: 0.4; cursor: default; }
  [hidden] { display: none !important; }

  /* the page itself */
  main { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
  article { max-width: 70ch; margin: 0 auto; padding: 38px 28px 96px; overflow-wrap: anywhere; }
  h1 { margin: 0 0 6px; font-size: 25px; line-height: 1.25; font-weight: 600; color: var(--text); letter-spacing: -0.01em; }
  .meta { margin: 0 0 30px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  h2 { margin: 38px 0 12px; font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--accent); }
  h3 { margin: 26px 0 8px; font-size: 15px; font-weight: 600; color: var(--text); }
  p { margin: 0 0 14px; }
  p.note { font-size: 12.5px; color: var(--muted); }
  ul, ol { margin: 0 0 14px; padding-left: 22px; }
  li { margin: 0 0 8px; padding-left: 4px; }
  li::marker { color: var(--muted); font-size: 0.85em; }
  strong { font-weight: 600; color: var(--text); }
  code { font-family: var(--mono); font-size: 0.9em; color: var(--text); }
  a { color: var(--text); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
    text-decoration-color: var(--muted); }
  a:hover, a:focus-visible { color: var(--accent); text-decoration-color: var(--accent); outline: none; }
  .empty { margin-top: 22vh; text-align: center; color: var(--muted); font-size: 13px; }
  ::selection { background: var(--rule); color: var(--text); }
  @media (max-width: 520px) { article { padding: 26px 18px 72px; } .bar { padding: 10px 18px; gap: 10px; flex-wrap: wrap; } }
  @media (prefers-reduced-motion: reduce) { #live i { animation: none; } }
</style>
</head>
<body>
<div class="bar">
  <span id="kind">Reader</span>
  <span id="live" hidden><i></i>Writing</span>
  <span id="note" role="status"></span>
  <span class="grow"></span>
  <select id="day" hidden title="Reports on record" aria-label="Day"></select>
  <button id="refresh" hidden title="Gather today's news again">Refresh</button>
  <button id="folder" hidden title="Every report is kept as a text file in this folder">Folder</button>
</div>
<main id="scroll"><article id="page"></article></main>

<script>
const TOKEN = '__JARVIS_TOKEN__';
const $ = (id) => document.getElementById(id);
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Jarvis-Token': TOKEN, ...(opts.headers || {}) } });
const NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.jarvis);

// ---------- drawing ----------
// The text is Markdown of a small, fixed kind: headings, paragraphs, lists, bold, code and links.
// Every piece is added as text, never as markup, so nothing a web page said can turn into something else.
function inline(el, text) {
  const re = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|\*\*([^*]+)\*\*|`([^`]+)`|(https?:\/\/[^\s<>()]*[^\s<>().,;:!?'"])/g;
  let at = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > at) el.append(text.slice(at, m.index));
    if (m[2] || m[5]) {
      const a = document.createElement('a'); a.href = m[2] || m[5]; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = m[2] ? m[1] : m[5].replace(/^https?:\/\/(www\.)?/, '');
      el.append(a);
    } else if (m[3]) { const b = document.createElement('strong'); inline(b, m[3]); el.append(b); }
    else { const c = document.createElement('code'); c.textContent = m[4]; el.append(c); }
    at = m.index + m[0].length;
  }
  if (at < text.length) el.append(text.slice(at));
}
function draw(md, meta) {
  const page = $('page'); page.textContent = '';
  let list = null, para = null, titled = false;
  const add = (tag, text, cls) => { const el = document.createElement(tag); if (cls) el.className = cls; if (text) inline(el, text); page.appendChild(el); list = para = null; return el; };
  const metaLine = () => { if (meta && !titled) { const p = add('p', '', 'meta'); p.textContent = meta; } titled = true; };
  for (const raw of md.split('\n')) {
    const line = raw.trim();
    let m;
    if (!line) { list = para = null; continue; }
    if (/^(```|-{3,}$|\*{3,}$)/.test(line)) continue;                       // fences and rules: not drawn
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { add('h' + m[1].length, m[2]); if (m[1].length === 1) metaLine(); continue; }
    metaLine();
    if ((m = line.match(/^[-*•]\s+(.*)$/)) || (m = line.match(/^(\d+)[.)]\s+(.*)$/))) {
      const tag = m.length === 3 ? 'ol' : 'ul';
      if (!list || list.tagName.toLowerCase() !== tag) { const l = add(tag, ''); if (tag === 'ol') l.start = Number(m[1]); list = l; }
      const li = document.createElement('li'); inline(li, m[m.length - 1]); list.appendChild(li); para = null;
    }
    else if (/^_.+_$/.test(line)) add('p', line.slice(1, -1), 'note');
    else if (para) { para.append(' '); inline(para, line.replace(/^>\s?/, '')); }
    else { const p = add('p', line.replace(/^>\s?/, '')); para = p; }
  }
}
function message(text) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = text; $('page').textContent = ''; $('page').appendChild(p); }
const toTop = () => { $('scroll').scrollTop = 0; };

// ---------- news ----------
const keyDate = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
let newsLoad = 0;
async function loadNews(day, refresh) {
  const mine = ++newsLoad;
  $('refresh').disabled = true; $('note').textContent = day ? '' : 'Gathering';
  if (!day) message('Gathering today\'s news…');
  let n;
  try { n = await (await api('/api/news?' + (day ? 'day=' + day : refresh ? 'refresh=1' : ''))).json(); }
  catch { if (mine === newsLoad) { $('note').textContent = ''; $('refresh').disabled = false; message('The news could not be loaded.'); } return; }
  if (mine !== newsLoad) return;   // something newer is on show
  $('refresh').disabled = false;
  $('note').textContent = n.error ? 'Not updated' : ''; $('note').title = n.error || '';
  const pick = $('day'); pick.textContent = '';
  for (const d of n.days) {
    const o = document.createElement('option'); o.value = d;
    o.textContent = (d === n.today ? 'Today · ' : '') + keyDate(d).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    pick.appendChild(o);
  }
  pick.hidden = n.days.length < 2; pick.value = n.day;
  if (n.text) draw(n.text); else message(n.error ? 'Today\'s news could not be gathered: ' + n.error : 'No report for that day.');
  toTop();
}
$('refresh').onclick = () => loadNews('', true);
$('day').onchange = (e) => loadNews(e.target.value);
$('folder').onclick = () => api('/api/open', { method: 'POST', body: JSON.stringify({ what: 'news' }) });

// ---------- what is on show ----------
let last = { n: -1, kind: '', at: '' };
function show(doc) {
  const news = doc.kind === 'news';
  $('kind').textContent = news ? 'News' : doc.kind === 'answer' ? 'Answer' : 'Reader';
  for (const id of ['refresh', 'folder']) $(id).hidden = !news;
  if (!news) { $('day').hidden = true; $('note').textContent = ''; newsLoad++; }
  $('live').hidden = !(doc.kind === 'answer' && doc.live);
  if (news) loadNews();
  else if (doc.kind === 'answer') {
    const when = new Date(doc.at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    draw(doc.md, when + (doc.ask ? ' · ' + doc.ask : ''));
    if (doc.at !== last.at || last.kind !== 'answer') toTop();   // a new answer starts at the top; one being written stays where you are
  }
  else message('Nothing to read yet. Ask JARVIS to show you something, or press News.');
  if (doc.kind !== last.kind || doc.at !== last.at) theme();   // the character may have changed since the last document
  last = doc;
}
async function theme() {
  try { document.body.classList.toggle('hal', (await (await api('/api/settings')).json()).settings.character === 'hal'); } catch {}
}
// The server sends the document on show, then again each time it changes. If the line drops, ask again.
async function listen() {
  for (;;) {
    try {
      const res = await api('/api/reader');
      const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl, doc = null;
        while ((nl = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, nl); buf = buf.slice(nl + 1); if (line) doc = JSON.parse(line); }
        if (doc) show(doc);   // only the newest of a burst needs drawing
      }
    } catch {}
    await new Promise((r) => setTimeout(r, 1000));
  }
}
theme(); listen();

// Esc closes the window.
addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (NATIVE) window.webkit.messageHandlers.jarvis.postMessage({ type: 'readerClose' }); else window.close();
});
</script>
</body>
</html>
