<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jarvis · tommy sendra</title>
<meta name="description" content="JARVIS, a voice assistant for the Mac. A scripted demo of its core.">
<style>
  :root {
    --glow: 95, 225, 255;
    --haze: 20, 90, 120;
    --bg: #03070d;
    --line: rgba(var(--glow), 0.22);
    --cyan: #5fe1ff;
    --text: #d6f4ff;
    --muted: #6f97a8;
    --amber: #ffb454;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  body.hal {
    --glow: 255, 74, 61; --haze: 120, 24, 18;
    --bg: #090303; --cyan: #ff4a3d; --text: #ffe9e5; --muted: #a8837d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(ellipse at 50% 42%, rgba(var(--haze), 0.28), transparent 60%),
      linear-gradient(rgba(var(--glow), 0.035) 1px, transparent 1px) 0 0 / 100% 44px,
      linear-gradient(90deg, rgba(var(--glow), 0.035) 1px, transparent 1px) 0 0 / 44px 100%,
      var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr auto;
    transition: background-color 0.6s;
  }
  a { color: inherit; }
  header, footer { padding: 14px 16px; color: var(--muted); line-height: 1.7; }
  header b { color: var(--text); font-weight: 400; }
  header .cmd { color: var(--cyan); }
  header .cmd i { color: var(--muted); font-style: normal; }

  .core { position: relative; min-height: 0; }
  #orb { width: 100%; height: 100%; display: block; cursor: pointer; }
  .under { position: absolute; left: 6%; right: 6%; bottom: 2%; display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none; }
  #caption { max-width: 720px; text-align: center; font-size: 15px; line-height: 1.55; min-height: 4.65em; display: flex; flex-direction: column; justify-content: flex-end; text-shadow: 0 0 18px var(--bg); text-wrap: balance; }
  #state { letter-spacing: 0.6em; margin-right: -0.6em; font-size: 12px; color: var(--cyan); text-shadow: 0 0 12px var(--cyan); transition: color 0.6s; }
  #live { color: var(--muted); min-height: 1.5em; font-size: 12px; text-align: center; }
  #live.heard { color: var(--text); }
  #live.tool { color: var(--amber); }

  footer { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; justify-content: center; }
  footer .gap { flex: 1 1 24px; max-width: 40px; }
  button {
    font: inherit; font-size: 11px; letter-spacing: 0.08em; color: var(--muted);
    background: none; border: 1px solid var(--line); border-radius: 2px; padding: 5px 9px; cursor: pointer;
  }
  button:hover, button:focus-visible { color: var(--cyan); border-color: var(--cyan); outline: none; }
  button.on { color: var(--bg); background: var(--cyan); border-color: var(--cyan); }
  button kbd { font: inherit; color: var(--cyan); margin-right: 6px; }
  button.on kbd { color: inherit; }
  .hear { text-align: center; padding-top: 14px; }
  #hear {
    font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; padding: 11px 22px;
    color: var(--cyan); border-color: var(--cyan); background: rgba(var(--glow), 0.08);
    animation: beckon 2.2s ease-in-out infinite;
  }
  #hear:hover, #hear:focus-visible { background: var(--cyan); color: var(--bg); }
  #hear small { display: block; margin-top: 4px; font-size: 10px; letter-spacing: 0.08em; text-transform: none; opacity: 0.75; }
  #hear.on { animation: none; background: none; border-color: var(--line); color: var(--muted); font-size: 11px; padding: 6px 12px; }
  #hear.on small { display: none; }
  @keyframes beckon {
    0%, 100% { box-shadow: 0 0 0 0 rgba(var(--glow), 0.5), 0 0 14px rgba(var(--glow), 0.25); }
    50% { box-shadow: 0 0 0 9px rgba(var(--glow), 0), 0 0 22px rgba(var(--glow), 0.45); }
  }
  @media (prefers-reduced-motion: reduce) { #hear { animation: none; } }
  @media (max-width: 560px) { #caption { font-size: 14px; } button kbd { display: none; } }
</style>
</head>
<body>

<header>
  <div><b>tommy@paris</b> ── ~/projects/jarvis</div>
  <div class="cmd">$ jarvis --demo <i># a voice assistant for the mac · this page is scripted, the real one listens</i></div>
  <div class="hear"><button id="hear"></button></div>
</header>

<section class="core">
  <canvas id="orb" aria-hidden="true"></canvas>
  <div class="under">
    <div id="caption" aria-live="polite"></div>
    <div id="state" role="status">STANDBY</div>
    <div id="live"></div>
  </div>
</section>

<footer>
  <span id="scenes"></span>
  <span class="gap"></span>
  <button id="next"><kbd>space</kbd>next</button>
  <button id="sound"><kbd>s</kbd>sound off</button>
  <button id="halBtn"><kbd>h</kbd>hal</button>
  <a href="/"><button tabindex="-1"><kbd>esc</kbd>back</button></a>
</footer>

<script>
const $ = id => document.getElementById(id);

// ---------- the script ----------
// Each scene is one exchange: what is said, the tool it reaches for, what it answers.
const SCENES = [
  { name: 'morning', ask: 'Good morning.', tool: 'weather · calendar',
    reply: 'Good morning, sir. Eleven degrees and clearing by noon. Two meetings today, the first at ten. Shall I play something to get you moving?' },
  { name: 'calendar', ask: 'Am I free on Thursday afternoon?', tool: 'google calendar',
    reply: 'Free from two until five, sir. After that you have dinner at eight.' },
  { name: 'search', ask: 'Who won the stage today?', tool: 'web search',
    reply: 'A breakaway of three held on to the line, sir. The yellow jersey finished in the bunch and keeps its lead.' },
  { name: 'dictate', ask: 'Write a polite no to this invitation.', tool: 'typing at your cursor',
    reply: 'Done, sir. Three sentences, typed where your cursor was. I have not sent anything.' },
];
const DOOR = { name: 'doors', ask: 'Open the pod bay doors, HAL.', tool: 'pod bay doors',
  reply: "I'm sorry, Dave. I'm afraid I can't do that." };

// ---------- state ----------
const LABELS = { idle: 'STANDBY', listening: 'LISTENING', thinking: 'PROCESSING', speaking: 'SPEAKING' };
const TONES = { idle: [95, 225, 255], listening: [110, 240, 170], thinking: [255, 190, 90], speaking: [190, 170, 255] };
const TONES_HAL = { idle: [226, 38, 30], listening: [255, 96, 60], thinking: [255, 140, 56], speaking: [255, 58, 44] };
let state = 'idle', hal = false, soundOn = false, tone = TONES.idle;
let run = 0, at = -1;      // run: the playback in progress; at: the scene showing
function setState(s) {
  state = s; tone = (hal ? TONES_HAL : TONES)[s];
  const css = `rgb(${tone.join(',')})`;
  $('state').textContent = LABELS[s]; $('state').style.color = css; $('state').style.textShadow = `0 0 12px ${css}`;
}
function setLive(text, kind) { $('live').textContent = text; $('live').className = kind || ''; }
const wait = ms => new Promise(r => setTimeout(r, ms));

// ---------- sound ----------
let audioCtx;
function chime(from, to) {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new AudioContext();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = audioCtx.currentTime;
    o.type = 'sine'; o.frequency.setValueAtTime(from, t0); o.frequency.exponentialRampToValueAtTime(to, t0 + 0.12);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
    o.connect(g).connect(audioCtx.destination); o.start(t0); o.stop(t0 + 0.18);
  } catch {}
}
const canSpeak = 'speechSynthesis' in window;
function say(text) {
  return new Promise(done => {
    if (!soundOn || !canSpeak) return done();
    const u = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    u.voice = voices.find(v => v.name === 'Daniel') || voices.find(v => v.lang === 'en-GB') || null;
    u.lang = 'en-GB'; u.rate = hal ? 0.85 : 1.05; u.pitch = hal ? 0.8 : 1;
    u.onend = u.onerror = done;
    speechSynthesis.speak(u);
    setTimeout(done, text.split(' ').length * 500 + 3000);   // in case the browser never reports the end
  });
}
function hush() { if (canSpeak) speechSynthesis.cancel(); }

// ---------- playback ----------
async function play(scene) {
  const id = ++run;
  const live = () => id === run;
  hush();
  $('caption').textContent = '';
  const reply = hal ? scene.reply.replace(/\bsir\b/g, 'Dave') : scene.reply;

  setState('listening'); chime(520, 880); setLive('', 'heard');
  for (let i = 1; i <= scene.ask.length; i++) {          // the question appears as it is heard
    await wait(38); if (!live()) return;
    setLive('“' + scene.ask.slice(0, i) + '”', 'heard');
  }
  await wait(450); if (!live()) return;
  chime(880, 520);

  setState('thinking'); setLive('▸ ' + scene.tool, 'tool');
  await wait(1500); if (!live()) return;

  setState('speaking'); setLive('“' + scene.ask + '”');
  const words = reply.split(' '), pace = soundOn && canSpeak ? (hal ? 400 : 330) : 210;
  const spoken = say(reply);
  for (let i = 1; i <= words.length; i++) {
    $('caption').textContent = words.slice(0, i).join(' ');
    await wait(pace); if (!live()) return;
  }
  await spoken; if (!live()) return;
  await wait(600); if (!live()) return;

  setState('idle'); setLive('');
  await wait(soundOn ? 6000 : 3200); if (!live()) return;   // then carry on by itself
  next();
}
function show(i) {
  at = i;
  document.querySelectorAll('#scenes button').forEach((b, n) => b.classList.toggle('on', n === i));
  play(SCENES[i]);
}
function next() { show((at + 1) % SCENES.length); }

function setSound(on) {
  soundOn = on;
  $('sound').innerHTML = `<kbd>s</kbd>sound ${on ? 'on' : 'off'}`;
  $('sound').classList.toggle('on', on);
  $('hear').innerHTML = on ? '■ mute' : '▶ turn sound on<small>hear it speak</small>';
  $('hear').classList.toggle('on', on);
  if (!on) hush(); else show(Math.max(at, 0));              // start the scene again, aloud
}
function setHal(on) {
  hal = on;
  document.body.classList.toggle('hal', on);
  $('halBtn').classList.toggle('on', on);
  if (on) { at = -1; document.querySelectorAll('#scenes button').forEach(b => b.classList.remove('on')); play(DOOR); }
  else show(0);
}

SCENES.forEach((s, i) => {
  const b = document.createElement('button');
  b.textContent = s.name; b.onclick = () => show(i);
  $('scenes').append(b, ' ');
});
$('next').onclick = next;
$('orb').onclick = next;
$('sound').onclick = $('hear').onclick = () => setSound(!soundOn);
$('hear').innerHTML = '▶ turn sound on<small>hear it speak</small>';
$('halBtn').onclick = () => setHal(!hal);
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 's') setSound(!soundOn);
  else if (e.key === 'h') setHal(!hal);
  else if (e.key === 'Escape') location.href = '/';
  else if (+e.key >= 1 && +e.key <= SCENES.length) show(+e.key - 1);
});
addEventListener('pagehide', hush);

// ---------- the core (lifted from the app's public/index.html) ----------
const cv = $('orb'), cx = cv.getContext('2d');
let W = 0, H = 0, energy = 0.15, t = 0;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize() {
  const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
  W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', resize); resize();
const TARGET = { idle: 0.14, listening: 0.6, thinking: 0.42, speaking: 0.85 };
const SPIN = { idle: 0.25, listening: 0.6, thinking: 2.4, speaking: 0.9 };
let shade = [95, 225, 255];
function arc(r, a0, a1, w, alpha) {
  cx.beginPath(); cx.arc(0, 0, r, a0, a1);
  cx.lineWidth = w; cx.strokeStyle = `rgba(${shade.map(Math.round).join(',')},${alpha})`; cx.stroke();
}
function drawEye(R, C) {
  cx.shadowBlur = 0;
  const breath = still ? 0 : 0.02 * Math.sin(t * 2.2);
  const ring = cx.createLinearGradient(0, -R * 1.2, 0, R * 1.2);
  ring.addColorStop(0, '#9aa1a6'); ring.addColorStop(0.45, '#2b2e31'); ring.addColorStop(0.55, '#1c1e20'); ring.addColorStop(1, '#727a80');
  cx.beginPath(); cx.arc(0, 0, R * 1.1, 0, Math.PI * 2); cx.lineWidth = R * 0.12; cx.strokeStyle = ring; cx.stroke();
  cx.beginPath(); cx.arc(0, 0, R * 1.165, 0, Math.PI * 2); cx.lineWidth = 1; cx.strokeStyle = 'rgba(255,255,255,0.18)'; cx.stroke();
  cx.beginPath(); cx.arc(0, 0, R * 1.04, 0, Math.PI * 2); cx.fillStyle = '#050101'; cx.fill();
  cx.save();
  cx.beginPath(); cx.arc(0, 0, R * 1.04, 0, Math.PI * 2); cx.clip();
  const reach = R * (0.62 + energy * 0.5 + breath);
  const g = cx.createRadialGradient(0, 0, 0, 0, 0, reach);
  g.addColorStop(0, 'rgba(255,240,190,0.98)');
  g.addColorStop(0.07, 'rgba(255,196,96,0.95)');
  g.addColorStop(0.2, `rgba(${C},0.92)`);
  g.addColorStop(0.5, `rgba(${C},${0.28 + energy * 0.35})`);
  g.addColorStop(1, `rgba(${C},0)`);
  cx.fillStyle = g; cx.fillRect(-R * 1.1, -R * 1.1, R * 2.2, R * 2.2);
  for (const r of [0.3, 0.5, 0.72, 0.92]) {
    cx.beginPath(); cx.arc(0, 0, R * r, 0, Math.PI * 2);
    cx.lineWidth = 1; cx.strokeStyle = `rgba(${C},${0.1 + energy * 0.18})`; cx.stroke();
  }
  const shine = cx.createLinearGradient(0, -R, 0, -R * 0.2);
  shine.addColorStop(0, 'rgba(255,255,255,0.13)'); shine.addColorStop(1, 'rgba(255,255,255,0)');
  cx.beginPath(); cx.ellipse(0, -R * 0.62, R * 0.72, R * 0.34, 0, 0, Math.PI * 2); cx.fillStyle = shine; cx.fill();
  cx.restore();
}
function draw() {
  for (let i = 0; i < 3; i++) shade[i] += (tone[i] - shade[i]) * 0.06;
  const C = shade.map(Math.round).join(',');
  const dt = still ? 0 : 0.016;
  let target = TARGET[state];
  if (state === 'speaking') target *= 0.65 + 0.35 * Math.abs(Math.sin(t * 9) * Math.sin(t * 3.3));
  energy += (target - energy) * 0.08;
  t += dt * SPIN[state];
  cx.clearRect(0, 0, W, H);
  cx.save();
  cx.translate(W / 2, H * 0.36);
  const R = Math.min(W, H * 0.8) * 0.3;
  if (hal) { drawEye(R * 0.92, C); cx.restore(); requestAnimationFrame(draw); return; }

  cx.shadowBlur = 0;
  cx.save(); cx.rotate(t * 0.15);
  for (let i = 0; i < 120; i++) {
    const a = (i / 120) * Math.PI * 2, long = i % 10 === 0;
    cx.beginPath();
    cx.moveTo(Math.cos(a) * R * 1.18, Math.sin(a) * R * 1.18);
    cx.lineTo(Math.cos(a) * R * (long ? 1.26 : 1.21), Math.sin(a) * R * (long ? 1.26 : 1.21));
    cx.lineWidth = 1; cx.strokeStyle = `rgba(${C},${long ? 0.7 : 0.25})`; cx.stroke();
  }
  cx.restore();
  cx.shadowColor = `rgb(${C})`; cx.shadowBlur = 14;

  cx.save(); cx.rotate(t * 0.6); arc(R * 1.08, 0, 1.9, 3, 0.8); arc(R * 1.08, 2.6, 4.2, 3, 0.5); arc(R * 1.08, 4.8, 5.9, 1, 0.5); cx.restore();
  cx.save(); cx.rotate(-t * 0.9); arc(R * 0.94, 0.4, 2.8, 1.5, 0.6); arc(R * 0.94, 3.6, 5.6, 6, 0.22); cx.restore();
  cx.save(); cx.rotate(t * 1.4); arc(R * 0.8, 1, 1.8, 2, 0.9); arc(R * 0.8, 3, 5.4, 1, 0.4); cx.restore();

  cx.beginPath();
  for (let i = 0; i <= 180; i++) {
    const a = (i / 180) * Math.PI * 2;
    const n = Math.sin(a * 7 + t * 5) * Math.sin(a * 3 - t * 3) + 0.5 * Math.sin(a * 13 + t * 8);
    const r = R * (0.6 + energy * 0.12 * n);
    i ? cx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : cx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  cx.closePath(); cx.lineWidth = 1.5; cx.strokeStyle = `rgba(${C},${0.45 + energy * 0.5})`; cx.stroke();

  cx.shadowBlur = 0;
  const cr = R * (0.3 + energy * 0.14 + (still ? 0 : 0.012 * Math.sin(t * 4)));
  const g = cx.createRadialGradient(0, 0, 0, 0, 0, cr * 1.7);
  g.addColorStop(0, `rgba(230,250,255,${0.55 + energy * 0.45})`);
  g.addColorStop(0.35, `rgba(${C},${0.35 + energy * 0.4})`);
  g.addColorStop(1, `rgba(${C},0)`);
  cx.fillStyle = g; cx.beginPath(); cx.arc(0, 0, cr * 1.7, 0, Math.PI * 2); cx.fill();
  arc(cr, 0, Math.PI * 2, 1.5, 0.9);
  cx.restore();
  requestAnimationFrame(draw);
}
draw();

setLive('');
setTimeout(() => show(0), 900);
</script>
</body>
</html>
