packages:
  - apps/*
  - packages/*
  - tooling/*

# One version of each shared dependency for the whole workspace.
# A package asks for it with "catalog:" instead of a version.
catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^24.0.0
  eslint: ^10.15.0
  prettier: ^3.10.1
  turbo: ^2.11.11
  typescript: ^7.0.2
  typescript-eslint: ^8.73.0
  vitest: ^5.1.0
  zod: ^4.6.7

# typescript-eslint parses with TypeScript's JavaScript API and does not accept TypeScript 7 yet.
# The linter therefore gets TypeScript 6 for parsing only. Type checking is always done by
# the version in the catalog above. Remove this once typescript-eslint supports TypeScript 7.
catalogs:
  lint:
    typescript: ^6.0.0

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.73.0'
  - '@typescript-eslint/parser@8.73.0'
  - '@typescript-eslint/project-service@8.73.0'
  - '@typescript-eslint/scope-manager@8.73.0'
  - '@typescript-eslint/tsconfig-utils@8.73.0'
  - '@typescript-eslint/type-utils@8.73.0'
  - '@typescript-eslint/types@8.73.0'
  - '@typescript-eslint/typescript-estree@8.73.0'
  - '@typescript-eslint/utils@8.73.0'
  - '@typescript-eslint/visitor-keys@8.73.0'
  - typescript-eslint@8.73.0
