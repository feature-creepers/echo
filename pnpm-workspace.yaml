packages:
  - apps/*
  - packages/*
  - tooling/*

# Install scripts of dependencies run only when allowed here. None of these needs its script:
# Electron downloads its program the first time it is run, esbuild works without it, and
# electron-winstaller builds a kind of Windows installer (Squirrel) that this project does not make.
allowBuilds:
  electron: false
  electron-winstaller: false
  esbuild: false

# One version of each shared dependency for the whole workspace.
# A package asks for it with "catalog:" instead of a version.
catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^24.0.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.3.0
  electron: ^45.3.0
  electron-builder: ^26.18.0
  electron-vite: ^6.0.0
  esbuild: ^0.28.2
  eslint: ^10.15.0
  prettier: ^3.10.1
  react: ^19.3.1
  react-dom: ^19.3.1
  turbo: ^2.11.11
  typescript: ^7.0.2
  typescript-eslint: ^8.72.0
  vite: ^8.3.8
  vitest: ^5.1.0
  zod: ^4.6.7

# typescript-eslint parses with TypeScript's JavaScript API and does not accept TypeScript 7 yet.
# The linter therefore gets TypeScript 6 for parsing only. Type checking is always done by
# the version in the catalog above. Remove this once typescript-eslint supports TypeScript 7.
catalogs:
  lint:
    typescript: ^6.0.0
