packages:
  - apps/*
  - packages/*
  - tooling/*

# Checks on every install. A version must be three days old, about the time a hijacked one takes to be found and
# pulled. A package may not lose the publishing evidence its earlier versions had (a trusted publisher, provenance).
# A dependency of a dependency must come from the registry, never from git or an address.
minimumReleaseAge: 4320
trustPolicy: no-downgrade
blockExoticSubdeps: true

# Install scripts of dependencies run only when allowed here. None of these needs its script:
# Electron downloads its program the first time it is run, esbuild works without it, and
# electron-winstaller builds a kind of Windows installer (Squirrel) that this project does not make.
allowBuilds:
  electron: false
  electron-winstaller: false
  esbuild: false

# One version of each shared dependency for the whole workspace.
# A package asks for it with "catalog:" instead of a version.
catalog:
  "@biomejs/biome": ^2.6.8
  "@fontsource-variable/geist": ^5.3.0
  "@fontsource-variable/geist-mono": ^5.3.0
  "@json-render/react": 0.23.1
  "@noble/hashes": ^2.4.0
  "@tailwindcss/vite": ^4.3.5
  "@types/d3-geo": ^3.1.0
  "@types/node": ^24.0.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@ui-sdk/core": 0.1.0-beta.7
  "@ui-sdk/react": 0.1.0-beta.7
  "@vitejs/plugin-react": ^6.3.0
