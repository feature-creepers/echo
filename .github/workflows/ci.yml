name: CI

on:
  push:
    branches: [main, rodolphe]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck, lint (including the dependency rules), formatting and tests.
      - run: pnpm check

      - run: pnpm build

      # Start the built desktop app, let it start the core and connect to it, and fail if it cannot.
      - name: Desktop self-check
        if: runner.os != 'Linux'
        run: pnpm --filter @repo/desktop self-check

      # A Linux runner has no display, and its Chromium sandbox helper is not set up.
      - name: Desktop self-check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @repo/desktop exec electron . --self-check --no-sandbox
