# How the desktop app is packaged for each system. It packages what build/stage.ts lays out in stage/:
# run `pnpm --filter @repo/desktop package:win` (or :mac, :linux) after `pnpm build`.
# The product's name and version come from ../package.json, through the staged manifest.
appId: io.github.feature-creepers.echo
copyright: Copyright © 2026 Rodolphe Barbanneau and Tommy Sendra

directories:
  output: ../release
  # Where build/stage.ts draws the icons.
  buildResources: build
electronVersion: 45.3.2

# The app is bundled by electron-vite into out/. What is read from node_modules at run time: the speech
# library; Playwright, which the core loads from the archive to drive the browser (the browser itself is the one
# installed on the computer); and for search by meaning, transformers.js with ONNX Runtime and sharp, and
# sqlite-vec. Their native parts must sit outside the archive to be loaded.
files:
  - out/**
  - package.json
  - node_modules/**
  - "!**/*.map"
asarUnpack:
  - node_modules/sherpa-onnx-*-*/**
  - node_modules/onnxruntime-node/bin/**
  - node_modules/@img/sharp-*/**
  - node_modules/sqlite-vec-*/**
npmRebuild: false

# Electron's switches, set in the packaged program: it cannot be started as plain Node, takes no Node
# options or debugger from its environment or command line, and runs only the archive it shipped with.
# Otherwise any program on the machine could run its own code as this app, with what the user allowed it.
# The core runs as an Electron utility process, which these do not affect.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true

# Signed by SignPath Foundation in the release workflow, once the owners have set it up there: the workflow names that
# signer in the app's update configuration, and an installed copy then installs only updates it signed. Every other
# build is unsigned, and installs updates signed or not.
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}

# The ZIP is what the updater reads on a Mac (latest-mac.yml names it); people download the DMG.
mac:
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.productivity
  icon: build/icon.icns
  # Signed with the owners' Developer ID when the build is given its certificate (CSC_LINK and CSC_KEY_PASSWORD, which
  # the release workflow passes), and notarised by Apple when it is also given APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
  # APPLE_TEAM_ID. Without a certificate, electron-builder says it found none and leaves the app unsigned: the person
  # opens it the first time with a right click, then Open, and it cannot install its updates.
  # Signed, the app runs under the hardened runtime, which notarisation requires: it may do only what its entitlements
  # name, and its helpers get the same. The paths are read from apps/desktop, where electron-builder is run.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: Echo listens to you when you talk to it. Your voice is turned into text on this computer.
    NSCameraUsageDescription: Echo takes a picture with your camera when you allow it, each time, to see what you show it.
    NSAppleEventsUsageDescription: Echo reads and works your other apps through System Events when you ask it to.
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  icon: build/icons
  target:
    - AppImage
  category: Utility
  # The program's file name. Left out, it would be taken from the workspace package's name.
  executableName: echo

# The GitHub releases of the project are the update feed: the packages, and the manifests that describe them
# (latest.yml, latest-mac.yml, latest-linux.yml), which electron-updater reads. The release workflow uploads
# them to a draft release; publishing the draft rolls the update out to every installed copy. The feed is also
# written into each package (app-update.yml), so the app knows where to look. The repository is the one the
# staged manifest names: build/stage.ts takes it from the GitHub Actions run, or from this clone's origin.
publish:
  provider: github
  releaseType: draft
